[package]
name = "vidsim"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "vidsim"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
anyhow = "1.0"
indicatif = { version = "0.17", features = ["rayon"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
